services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyricspro
      POSTGRES_USER: lyricspro
      POSTGRES_PASSWORD: lyricspro
    ports:
      - "5432:5432"
    volumes:
      - lyricspro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyricspro -d lyricspro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lyricspro_postgres:
