services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyranta
      POSTGRES_USER: lyranta
      POSTGRES_PASSWORD: lyranta
    ports:
      - "5432:5432"
    volumes:
      - lyranta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyranta -d lyranta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lyranta_postgres:
