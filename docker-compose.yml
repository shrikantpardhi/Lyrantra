services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyrantra
      POSTGRES_USER: lyrantra
      POSTGRES_PASSWORD: lyrantra
    ports:
      - "5432:5432"
    volumes:
      - lyrantra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrantra -d lyrantra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lyrantra_postgres:
