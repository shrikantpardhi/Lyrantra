name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://lyranta.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Blocks production traffic on Vercel until a reviewer approves.
  # No Vercel tokens or secrets are used — Vercel Git deploys the build;
  # Deployment Checks wait for this job before assigning the production domain.
  approve-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Production release approved
        run: echo "CI passed and production release was approved."
